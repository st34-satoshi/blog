<h2 class="wp-block-heading"><span id="toc1">やりたいこと</span></h2>
<p class="wp-block-paragraph">VPN接続。</p>
<h2 class="wp-block-heading"><span id="toc2">問題</span></h2>
<p class="wp-block-paragraph">VPN接続しようとすると、「L2TP-VPNサーバが応答しませんでした。」</p>
<figure class="wp-block-image size-large"><img alt="" class="wp-image-758" decoding="async" fetchpriority="high" height="292" sizes="(max-width: 816px) 100vw, 816px" src="/wp-content/uploads/2021/04/vpn-error.png" srcset="/wp-content/uploads/2021/04/vpn-error.png 816w, /wp-content/uploads/2021/04/vpn-error-300x107.png 300w, /wp-content/uploads/2021/04/vpn-error-768x275.png 768w" width="816"/></figure>
<h2 class="wp-block-heading"><span id="toc3">解決策</span></h2>
<p class="wp-block-paragraph">ルーターの設定のパススルーでIPSecを有効にする。</p>
