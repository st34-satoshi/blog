<h2 class="wp-block-heading"><span id="toc1">結論</span></h2>
<p class="wp-block-paragraph">納税額を決めるための年末調整と確定申告。両方やる場合は<span class="bold-blue">証明書</span>の提出は<span class="bold-blue">年末調整だけ</span>で良い。控除額は確定申告でも申請する必要がある。</p>
