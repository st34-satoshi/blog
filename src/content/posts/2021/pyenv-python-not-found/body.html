<h2 class="wp-block-heading"><span id="toc1">問題</span></h2>
<p class="wp-block-paragraph">pyenvでPythonをインストールしたが、<code>$python -V</code> で、<span class="has-inline-color has-brown-color"> Command ‘python’ not found</span> と表示される。</p>
<h2 class="wp-block-heading"><span id="toc2">原因・解決</span></h2>
<pre class="wp-block-code"><code><mark class="has-inline-color has-indigo-color" style="background-color:rgba(0, 0, 0, 0)">source ~/.bash_profile</mark></code></pre>
<p class="wp-block-paragraph">で環境設定の変更を反映させる。</p>
<h2 class="wp-block-heading"><span id="toc3">終わりに</span></h2>
<p class="wp-block-paragraph">pyenvのインストールは<a data-id="https://github.com/pyenv/pyenv#installation" data-type="URL" href="https://github.com/pyenv/pyenv#installation" rel="noopener" target="_blank">Github</a>がわかりやすい。</p>
