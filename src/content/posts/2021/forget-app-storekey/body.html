<p class="wp-block-paragraph">Google Play Storeに登録しているkeystoreのパスワードを忘れたときの対応。</p>

<h2 class="wp-block-heading"><span id="toc1">解決策</span></h2>
<p class="wp-block-paragraph">Google に申請して新しいkeyを登録してもらう。</p>
<p class="wp-block-paragraph">参考サイト: <a href="https://support.google.com/googleplay/android-developer/answer/9842756?hl=ja" rel="noopener" target="_blank">Play アプリ署名を使用する – Play Console ヘルプ</a> アップロード鍵の紛失または不正使用。</p>
<h2 class="wp-block-heading"><span id="toc2">終わりに</span></h2>
<p class="wp-block-paragraph">個人のブログなどを見てもいい方法が見つからないときは、公式ドキュメントを調べるべき。</p>
