<p class="wp-block-paragraph">急な出費でクレジットカードの利用枠を超える支払いがあるときの対処法。</p>
<h2 class="wp-block-heading">やること</h2>
<p class="wp-block-paragraph">クレジットカード会社に電話して、利用枠を変更したい理由を説明する。</p>
<p class="wp-block-paragraph">急用であることを伝えれば、その日のうちに対応してくれる。</p>
<p class="wp-block-paragraph">(12時頃電話して、13時につながり、17時までに審査をしてくれると約束してくれた。実際には15時くらいに審査が通ったことを電話で伝えられた)</p>
