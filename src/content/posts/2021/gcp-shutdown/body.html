<p class="wp-block-paragraph">GCPでは簡単にプロジェクトを消去でき、30日いないなら復元できる。</p>
<p class="wp-block-paragraph">消去は「プロジェクトの設定」から「シャットダウン」でできる。</p>
<p class="wp-block-paragraph">復元は「メニュー」-&gt;「IAMと管理」-&gt;「リソースの管理」-&gt;「消去保留中のリソース」から復元できる。</p>
