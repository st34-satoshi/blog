<p class="wp-block-paragraph">ざっくりしているが考え方や自分の価値観がわかる記事のまとめ。</p>
<p class="wp-block-paragraph">価値観が1ヶ月で大きく変わることはないと思うが、１年くらい経つと変わっているかもしれない。記事に書いてある考え方を今もしているかは不明だが、そう考えていたことがあったはず。</p>
