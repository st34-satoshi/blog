<p class="wp-block-paragraph">MacのchromeでOverleafを使用しているときに、カーソル位置がずれることがある。Playground javaをしようしているときも同様の問題が発生した。</p>
<p class="wp-block-paragraph">解決方法はこちらのサイトで詳しく説明している。<a data-id="https://toshs.hatenablog.com/entry/2018/07/31/035947" data-type="URL" href="https://toshs.hatenablog.com/entry/2018/07/31/035947" rel="noopener" target="_blank">MacOSのChromeからOverleaf v2を使っているとカーソルがずれるときの対処法 – toshs memo</a></p>
<p class="wp-block-paragraph"><strong>Font Book.app</strong>から<strong>Osaka</strong>のレギュラーの使用を停止すれば良い。</p>
<p class="wp-block-paragraph">Osakaがダウンロードできていなければ、ダウンロードしてから、使用を停止する。</p>
